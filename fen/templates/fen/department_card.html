{% load static %}
<div class="department_card">
     <h3>{{ department.name }}</h3>
    <p>
        <strong>Завідувач кафедри: </strong>
        {{ department.head_of_department }}
    </p>
    <div class="specialities">
        <strong>Спеціальності: </strong>
        {% if department.specialities.all %}
            {% for speciality in department.specialities.all %}
                <li>{{speciality.name}}</li>
            {% endfor %}
        {% else %}
            <p>Немає спеціальностей</p>
        {% endif %}
   </div>
</div>
