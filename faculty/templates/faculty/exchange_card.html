{% load static %}
<div class="exchange_card">
     <a href="{% url 'faculty:exchange_detail' exchange.id %}" class="exchange_link">
        <h3>{{ exchange.university_name }}</h3>
     </a>
    <p>{{ exchange.description|truncatewords:5 }}</p>
    <p>
        <strong>Країна: </strong>
        {{exchange.country}}
    </p>
    <p>
        <strong>Мови навчання: </strong>
        {{ exchange.languages }}
    </p>
    <p>
        <strong>Кількість місць: </strong>
        {{ exchange.number_of_seats }}
    </p>
     <p>
        <strong>Дедлайн подачі: </strong>
        {{ exchange.deadline|date:"d.m.Y" }}
    </p>
</div>
